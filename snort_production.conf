###################################################
# Step #5: Configure output plugins
###################################################

# Fast alert output to file
output alert_fast: alert.ids

###################################################
# Step #6: Include classification & reference configs
###################################################

# metadata reference data
include classification.config
include reference.config

###################################################
# Step #7: Include rule files (PRODUCTION RULES)
###################################################

# Custom production rules for real threat detection
include $RULE_PATH/production-threats.rules

# Community rules for known threats (if available)
# Uncomment if you have Snort community rules installed
# include $RULE_PATH/community.rules

# Event thresholding or suppression commands
# include threshold.conf

